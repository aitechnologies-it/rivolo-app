name = "rivolo-mcp"
account_id = "1ec7ca4fc74c00e7746eeea3a52ea7b5"
main = "mcp/worker.ts"
compatibility_date = "2026-06-21"
routes = [{ pattern = "mcp.aitlab.it", custom_domain = true }]

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp"
database_id = "daf4016f-71ca-41e7-b03b-641785a2f76c"
migrations_dir = "migrations"

[vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
MCP_ALLOWED_ORIGINS = "https://mcp.aitlab.it"
MCP_OAUTH_ISSUER_URL = "https://rivolo.aitlab.it/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp.aitlab.it/mcp"

# Isolated dev Worker; production remains the top-level configuration.
[env.dev]
name = "rivolo-mcp-dev"
workers_dev = false
routes = [{ pattern = "mcp-dev.aitlab.it", custom_domain = true }]

[env.dev.triggers]
crons = ["0 3 * * *"]

[env.dev.vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
MCP_ALLOWED_ORIGINS = "https://mcp-dev.aitlab.it"
MCP_OAUTH_ISSUER_URL = "https://dev.aitlab.it/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp-dev.aitlab.it/mcp"

[[env.dev.d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp-dev"
database_id = "3f72928e-d1b2-4596-87f1-ff98b96327e0"
migrations_dir = "migrations"
