name = "rivolo-app"
account_id = "1ec7ca4fc74c00e7746eeea3a52ea7b5"
pages_build_output_dir = "./dist"
compatibility_date = "2026-06-21"

[[durable_objects.bindings]]
name = "ONEDRIVE_EVENTS"
class_name = "OneDriveEvents"
script_name = "rivolo-onedrive-events"

# Public identifiers only. Secrets (client secrets, token encryption keys)
# must NOT go here — set them as encrypted Secrets in the Cloudflare dashboard.
[vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
GOOGLE_ALLOWED_ORIGINS = "http://localhost:8788"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
DROPBOX_ALLOWED_ORIGINS = "http://localhost:8788"
ONEDRIVE_CLIENT_ID = "f84271d0-b942-4bd6-9a20-5ac66bfb1c2f"
ONEDRIVE_ALLOWED_ORIGINS = "http://localhost:8788"
MCP_OAUTH_ISSUER_URL = "https://aitlab.it/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp.aitlab.it/mcp"
VITE_MCP_ENDPOINT = "https://mcp.aitlab.it/mcp"

[[d1_databases]]
binding = "MCP_DB"
database_name = "rivolo-mcp"
database_id = "daf4016f-71ca-41e7-b03b-641785a2f76c"
migrations_dir = "migrations"

[env.production.vars]
GOOGLE_CLIENT_ID = "535138004412-dme8a9sitbamhg00jiln5eang5b7nf8s.apps.googleusercontent.com"
GOOGLE_ALLOWED_ORIGINS = "https://aitlab.it"
DROPBOX_CLIENT_ID = "u97wik4j3zxkssp"
DROPBOX_ALLOWED_ORIGINS = "https://aitlab.it"
MCP_OAUTH_ISSUER_URL = "https://aitlab.it/api/mcp/oauth"
MCP_RESOURCE_URL = "https://mcp.aitlab.it/mcp"
VITE_MCP_ENDPOINT = "https://mcp.aitlab.it/mcp"
ONEDRIVE_CLIENT_ID = "f84271d0-b942-4bd6-9a20-5ac66bfb1c2f"
ONEDRIVE_ALLOWED_ORIGINS = "https://aitlab.it"

[[env.production.durable_objects.bindings]]
name = "ONEDRIVE_EVENTS"
class_name = "OneDriveEvents"
